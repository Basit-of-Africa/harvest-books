<!doctype html>
<html lang="en-NG">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="description" content="Bookkeeping and NRS e-invoicing for a growing Nigerian agribusiness.">
<style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font:14px system-ui,sans-serif}img{max-width:100%}[hidden]{display:none!important}</style>
</head>
<body>
<title>Harvest Books</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@75..100,400..800&family=Public+Sans:ital,wght@0,400;0,500;0,600;1,400&display=swap">
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcode-generator/1.4.4/qrcode.min.js"></script>
<style>
/* Layout: ledger-book rail on the left (the nine books + e-invoicing), working sheet on the right; collapses to a scrolling tab strip on phones. */
:root{
  --paper:#F3F6F2; --sheet:#FFFFFF; --sheet-2:#F8FAF7; --ink:#16211B; --muted:#5A685F; --rule:#D6DED7; --rule-2:#E7ECE7;
  --ledger:#1D5A3E; --ledger-ink:#FFFFFF; --ledger-soft:#E3EEE7;
  --stamp:#2F43B5; --stamp-soft:#E8EBFA;
  --ok:#1B7443; --ok-soft:#E1F1E7; --warn:#9A6200; --warn-soft:#FBF0DA; --bad:#B0281F; --bad-soft:#FBE6E3;
  --doc-bg:#FFFFFF; --doc-ink:#1A1F1C; --doc-muted:#5F6862; --doc-rule:#DADFDB;
  --f-display:"Archivo","Arial Narrow",system-ui,sans-serif;
  --f-body:"Public Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-code:ui-monospace,"SFMono-Regular",Menlo,Consolas,monospace;
  --r-s:6px; --r-m:10px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --paper:#0E1411; --sheet:#151D19; --sheet-2:#19231E; --ink:#E4EBE6; --muted:#9AA8A0; --rule:#2A3631; --rule-2:#222C27;
  --ledger:#62C291; --ledger-ink:#0B1A12; --ledger-soft:#1C3127;
  --stamp:#93A2FF; --stamp-soft:#1F2547;
  --ok:#67CF93; --ok-soft:#173226; --warn:#E7AE48; --warn-soft:#352A12; --bad:#FF8F84; --bad-soft:#3A1C1A;
  color-scheme:dark}}
:root[data-theme="dark"]{
  --paper:#0E1411; --sheet:#151D19; --sheet-2:#19231E; --ink:#E4EBE6; --muted:#9AA8A0; --rule:#2A3631; --rule-2:#222C27;
  --ledger:#62C291; --ledger-ink:#0B1A12; --ledger-soft:#1C3127;
  --stamp:#93A2FF; --stamp-soft:#1F2547;
  --ok:#67CF93; --ok-soft:#173226; --warn:#E7AE48; --warn-soft:#352A12; --bad:#FF8F84; --bad-soft:#3A1C1A;
  color-scheme:dark}
*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--paper);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased}
.shell{display:grid;grid-template-columns:232px minmax(0,1fr);min-height:100%}
/* rail */
.rail{background:var(--sheet);border-right:1px solid var(--rule);padding-block:20px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:16px;display:flex;flex-direction:column;gap:18px;position:sticky;top:0;height:100vh;overflow-y:auto}
.brand{display:flex;flex-direction:column;gap:2px}
.brand b{font-family:var(--f-display);font-stretch:80%;font-weight:800;font-size:24px;letter-spacing:-.01em;line-height:1}
.brand span{color:var(--muted);font-size:13px}
.navgroup{display:flex;flex-direction:column;gap:2px}
.navgroup h4{margin:0 0 4px 10px;font:600 12px/1.2 var(--f-body);color:var(--muted)}
.nav{display:flex;align-items:center;justify-content:space-between;gap:8px;width:100%;text-align:left;background:none;border:0;border-radius:var(--r-s);padding:7px 10px;font:500 14px/1.3 var(--f-body);color:var(--ink);cursor:pointer}
.nav:hover{background:var(--sheet-2)}
.nav[aria-current="page"]{background:var(--ledger);color:var(--ledger-ink)}
.nav .badge{font:600 11px/1 var(--f-body);background:var(--stamp-soft);color:var(--stamp);border-radius:999px;padding:3px 7px}
.nav[aria-current="page"] .badge{background:var(--ledger-ink);color:var(--ledger)}
.mode{margin-top:auto;font-size:12.5px;color:var(--muted);border-top:1px solid var(--rule);padding-top:12px}
.mode strong{color:var(--ink);font-weight:600;display:block}
main{min-width:0;padding-block:28px 64px;padding-left:max(16px,4vw);padding-right:max(16px,env(safe-area-inset-right,0px),4vw);outline:none}
.wrap{max-width:1180px;display:flex;flex-direction:column;gap:22px}
/* type */
h1{font-family:var(--f-display);font-weight:750;font-stretch:84%;font-size:clamp(28px,3.4vw,38px);line-height:1.05;letter-spacing:-.015em;margin:0;text-wrap:balance}
h2{font-family:var(--f-display);font-weight:700;font-stretch:88%;font-size:20px;line-height:1.2;margin:0}
h3{font-family:var(--f-display);font-weight:650;font-size:16px;margin:0}
p{margin:0}
.lede{color:var(--muted);max-width:64ch}
.head{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:12px 20px}
.head .titles{display:flex;flex-direction:column;gap:6px;min-width:0}
.num,.money{font-variant-numeric:tabular-nums}
/* surfaces */
.panel{background:var(--sheet);border:1px solid var(--rule);border-radius:var(--r-m);padding:18px}
.panel.flush{padding:0;overflow:hidden}
.panel-h{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:8px 16px;margin-bottom:14px}
.muted{color:var(--muted)}
.small{font-size:13px}
/* buttons + inputs */
button,.btn{font:600 14px/1 var(--f-body);border-radius:var(--r-s);padding:10px 14px;border:1px solid var(--rule);background:var(--sheet);color:var(--ink);cursor:pointer;display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
button:hover{border-color:var(--muted)}
button.primary{background:var(--ledger);border-color:var(--ledger);color:var(--ledger-ink)}
button.stamp{background:var(--stamp);border-color:var(--stamp);color:var(--sheet)}
button.ghost{background:none;border-color:transparent;padding:6px 8px;color:var(--muted);font-weight:500}
button.ghost:hover{color:var(--ink);background:var(--sheet-2)}
button.danger{color:var(--bad)}
button.danger.armed{background:var(--bad);border-color:var(--bad);color:var(--sheet)}
button:disabled{opacity:.45;cursor:not-allowed}
:focus-visible{outline:2px solid var(--stamp);outline-offset:2px}
label.f{display:flex;flex-direction:column;gap:5px;font-size:13px;font-weight:500;color:var(--muted);min-width:0}
input,select,textarea{font:400 14.5px/1.3 var(--f-body);color:var(--ink);background:var(--sheet);border:1px solid var(--rule);border-radius:var(--r-s);padding:9px 10px;width:100%;min-width:0}
input[type=number]{font-variant-numeric:tabular-nums}
input:focus,select:focus,textarea:focus{border-color:var(--stamp);outline:none;box-shadow:0 0 0 3px var(--stamp-soft)}
textarea{resize:vertical;min-height:70px}
.grid{display:grid;gap:12px}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
.gauto{grid-template-columns:repeat(auto-fill,minmax(150px,1fr))}
.span2{grid-column:span 2}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.row.end{justify-content:flex-end}
.hint{font-size:12.5px;color:var(--muted);font-weight:400}
/* tables */
.tbl{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:14px}
th{font:600 12.5px/1.2 var(--f-body);color:var(--muted);text-align:left;padding:10px 12px;border-bottom:1px solid var(--rule);background:var(--sheet-2);white-space:nowrap}
td{padding:9px 12px;border-bottom:1px solid var(--rule-2);vertical-align:top}
td.r,th.r{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
tr.total td{font-weight:650;border-top:1px solid var(--rule);border-bottom:0;background:var(--sheet-2)}
tr.ex td{color:var(--muted)}
tbody tr:hover td{background:var(--sheet-2)}
tr.click{cursor:pointer}
td.act{white-space:nowrap;text-align:right;width:1%}
.neg{color:var(--bad)}
/* chips */
.chip{display:inline-flex;align-items:center;gap:5px;font:600 12px/1 var(--f-body);border-radius:999px;padding:4px 9px;white-space:nowrap;background:var(--sheet-2);color:var(--muted);border:1px solid var(--rule)}
.chip.ok{background:var(--ok-soft);color:var(--ok);border-color:transparent}
.chip.warn{background:var(--warn-soft);color:var(--warn);border-color:transparent}
.chip.bad{background:var(--bad-soft);color:var(--bad);border-color:transparent}
.chip.stamp{background:var(--stamp-soft);color:var(--stamp);border-color:transparent}
.chip.ledger{background:var(--ledger-soft);color:var(--ledger);border-color:transparent}
.chip::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.chip.plain::before{display:none}
/* summary figures */
.figs{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));border:1px solid var(--rule);border-radius:var(--r-m);background:var(--sheet);overflow:hidden}
.fig{padding:16px 18px;border-right:1px solid var(--rule-2);border-bottom:1px solid var(--rule-2);display:flex;flex-direction:column;gap:4px;min-width:0}
.fig .k{font-size:13px;color:var(--muted)}
.fig .v{font-family:var(--f-display);font-stretch:82%;font-weight:700;font-size:24px;font-variant-numeric:tabular-nums;line-height:1.1;overflow-wrap:anywhere}
.fig .s{font-size:12.5px;color:var(--muted)}
.fig.lead{background:var(--ledger);color:var(--ledger-ink)}
.fig.lead .k,.fig.lead .s{color:inherit;opacity:.8}
.cols{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(0,1fr);gap:22px;align-items:start}
.kv{display:grid;grid-template-columns:1fr auto;gap:8px 16px;font-size:14px}
.kv dt{color:var(--muted)} .kv dd{margin:0;text-align:right;font-variant-numeric:tabular-nums;font-weight:600}
.kv .sep{grid-column:1/-1;border-top:1px solid var(--rule-2);margin:2px 0}
.checklist{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px;font-size:14px}
.checklist li{display:flex;gap:10px;align-items:flex-start}
.tick{flex:none;width:18px;height:18px;border-radius:50%;border:1.5px solid var(--rule);display:grid;place-items:center;margin-top:1px}
.tick.on{background:var(--ok);border-color:var(--ok)}
.tick.on::after{content:"";width:5px;height:9px;border:solid var(--sheet);border-width:0 2px 2px 0;transform:translateY(-1px) rotate(45deg)}
/* period bar */
.seg{display:inline-flex;border:1px solid var(--rule);border-radius:var(--r-s);overflow:hidden;background:var(--sheet)}
.seg button{border:0;border-radius:0;border-right:1px solid var(--rule);padding:8px 11px;font-weight:500}
.seg button:last-child{border-right:0}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--paper)}
.period{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.period input{width:auto}
/* chart */
.chart svg{width:100%;height:auto;display:block}
.legend{display:flex;gap:16px;font-size:13px;color:var(--muted)}
.legend i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:6px;vertical-align:-1px}
/* invoice editor */
.lines{display:flex;flex-direction:column;gap:10px}
.line{display:grid;grid-template-columns:minmax(0,2.2fr) minmax(0,1fr) minmax(0,1.3fr) 80px 92px 120px 100px 140px 36px;gap:8px;align-items:end;padding:12px;border:1px solid var(--rule-2);border-radius:var(--r-s);background:var(--sheet-2)}
.line .ext{font-variant-numeric:tabular-nums;font-weight:600;padding-bottom:10px;text-align:right;grid-column:1/-2}
.line .rm{padding:9px;justify-content:center}
.totals{margin-left:auto;min-width:min(340px,100%)}
.issues{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px;font-size:14px}
.issues li{display:flex;gap:10px;align-items:flex-start;padding:8px 10px;border-radius:var(--r-s)}
.issues li.error{background:var(--bad-soft);color:var(--bad)}
.issues li.warn{background:var(--warn-soft);color:var(--warn)}
.issues li.pass{background:var(--ok-soft);color:var(--ok)}
/* invoice detail */
.detail{display:grid;grid-template-columns:minmax(0,1.45fr) minmax(300px,1fr);gap:22px;align-items:start}
.steps{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.step{display:grid;grid-template-columns:28px 1fr;gap:12px;padding-bottom:18px;position:relative}
.step:not(:last-child)::after{content:"";position:absolute;left:13px;top:28px;bottom:2px;width:2px;background:var(--rule)}
.step .dot{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;font:700 13px/1 var(--f-display);border:2px solid var(--rule);background:var(--sheet);color:var(--muted);z-index:1}
.step.done .dot{background:var(--stamp);border-color:var(--stamp);color:var(--sheet)}
.step.now .dot{border-color:var(--stamp);color:var(--stamp)}
.step.fail .dot{background:var(--bad);border-color:var(--bad);color:var(--sheet)}
.step .body{display:flex;flex-direction:column;gap:8px;padding-top:3px;min-width:0}
.step .body h3{font-size:15px}
pre.code{font:12.5px/1.5 var(--f-code);background:var(--sheet-2);border:1px solid var(--rule);border-radius:var(--r-s);padding:12px;overflow:auto;max-height:420px;margin:0;white-space:pre}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--rule);margin-bottom:14px}
.tabs button{border:0;border-bottom:2px solid transparent;border-radius:0;background:none;padding:10px 12px;color:var(--muted);font-weight:600}
.tabs button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--ink)}
/* the paper invoice */
.doc{background:var(--doc-bg);color:var(--doc-ink);border:1px solid var(--rule);border-radius:4px;box-shadow:0 1px 0 var(--rule),0 18px 40px -28px rgba(10,30,20,.45);padding:clamp(18px,4vw,40px);display:flex;flex-direction:column;gap:22px;font-size:13.5px;overflow:hidden}
.doc .band{height:6px;margin:calc(-1 * clamp(18px,4vw,40px)) calc(-1 * clamp(18px,4vw,40px)) 0;background:var(--brand,#1D5A3E)}
.doc-top{display:flex;flex-wrap:wrap;justify-content:space-between;gap:18px}
.doc-from{display:flex;gap:14px;align-items:flex-start;min-width:0}
.doc-from img{max-width:72px;max-height:72px;object-fit:contain}
.doc-from b{font-family:var(--f-display);font-size:18px;font-weight:750;display:block;color:var(--brand,#1D5A3E)}
.doc-title{text-align:right}
.doc-title .t{font-family:var(--f-display);font-stretch:78%;font-weight:800;font-size:30px;line-height:1;color:var(--doc-ink)}
.doc-title .n{font-variant-numeric:tabular-nums;color:var(--doc-muted);margin-top:4px}
.doc .dm{color:var(--doc-muted)}
.doc-parties{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px}
.doc-parties h5{margin:0 0 4px;font:600 12px/1.2 var(--f-body);color:var(--doc-muted)}
.doc table th{background:transparent;color:var(--doc-muted);border-bottom:1.5px solid var(--doc-ink);padding:8px 6px}
.doc table td{border-bottom:1px solid var(--doc-rule);padding:8px 6px}
.doc tbody tr:hover td{background:transparent}
.doc-foot{display:flex;flex-wrap:wrap;gap:22px;justify-content:space-between;align-items:flex-start}
.doc-sum{min-width:min(260px,100%);margin-left:auto}
.doc-sum .kv dt{color:var(--doc-muted)}
.doc-sum dt.grand{color:var(--doc-ink)}
.doc-sum .grand{font-family:var(--f-display);font-weight:800;font-size:19px;border-top:1.5px solid var(--doc-ink);padding-top:8px}
/* the NRS seal: the one bold element */
.seal{display:grid;grid-template-columns:auto minmax(0,1fr);gap:14px;align-items:center;border:2px solid #2F43B5;border-radius:6px;padding:12px;color:#2F43B5;max-width:440px;position:relative}
.seal.pending{border-style:dashed;border-color:#9AA3C9;color:#6B7395}
.seal .qr{width:112px;height:112px;display:grid;place-items:center;background:#fff}
.seal .qr svg{width:112px;height:112px}
.seal .qr.empty{border:1.5px dashed currentColor;font-size:11px;text-align:center;padding:8px;line-height:1.3}
.seal .lbl{font:700 12px/1.2 var(--f-display);font-stretch:85%;letter-spacing:.02em}
.seal .irn{font:700 15px/1.25 var(--f-display);font-stretch:80%;font-variant-numeric:tabular-nums;overflow-wrap:anywhere;color:#1A1F1C}
.seal .meta{font-size:11.5px;line-height:1.4;overflow-wrap:anywhere}
.seal .sim{position:absolute;top:-10px;right:10px;background:#B0281F;color:#fff;font:700 10.5px/1 var(--f-body);padding:4px 7px;border-radius:3px}
/* misc */
[hidden]{display:none!important}
.empty{padding:28px 18px;text-align:center;color:var(--muted);display:flex;flex-direction:column;gap:10px;align-items:center}
.empty b{color:var(--ink);font-family:var(--f-display);font-size:17px}
.note{border-left:3px solid var(--stamp);background:var(--stamp-soft);padding:10px 14px;border-radius:0 var(--r-s) var(--r-s) 0;font-size:13.5px;color:var(--ink)}
.note.warn{border-left-color:var(--warn);background:var(--warn-soft)}
#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(20px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--paper);padding:11px 16px;border-radius:var(--r-s);font-size:14px;z-index:50;max-width:calc(100% - 32px)}
#modal{position:fixed;inset:0;background:rgba(8,14,11,.55);display:grid;place-items:center;z-index:40;padding:16px}
#modal .box{background:var(--sheet);border-radius:var(--r-m);border:1px solid var(--rule);padding:20px;width:min(640px,100%);max-height:90vh;overflow:auto;display:flex;flex-direction:column;gap:12px}
.logo-prev{width:64px;height:64px;border:1px dashed var(--rule);border-radius:var(--r-s);display:grid;place-items:center;overflow:hidden;background:#fff}
.logo-prev img{max-width:100%;max-height:100%}
.swatch{width:40px;height:38px;padding:2px;border-radius:var(--r-s)}
@media (max-width:1100px){
  .line{grid-template-columns:repeat(4,minmax(0,1fr))}
  .line .wide{grid-column:span 2}
  .line .ext{grid-column:1/-2}
  .detail{grid-template-columns:minmax(0,1fr)}
}
@media (max-width:860px){
  .shell{grid-template-columns:minmax(0,1fr)}
  .rail{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;height:auto;flex-direction:row;align-items:center;gap:10px;overflow-x:auto;padding-block:10px;border-right:0;border-bottom:1px solid var(--rule);padding-right:max(16px,env(safe-area-inset-right,0px))}
  body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:21;background:var(--sheet)}
  .brand span,.navgroup h4,.mode{display:none}
  .brand b{font-size:19px;white-space:nowrap;margin-right:6px}
  .navgroup{flex-direction:row;gap:2px}
  .nav{white-space:nowrap;width:auto}
  .figs{grid-template-columns:repeat(2,minmax(0,1fr))}
  .cols{grid-template-columns:minmax(0,1fr)}
  .g3,.g4{grid-template-columns:repeat(2,minmax(0,1fr))}
  main{padding-top:20px}
}
@media (max-width:520px){
  .g2,.g3,.g4{grid-template-columns:minmax(0,1fr)}
  .span2{grid-column:auto}
  .line{grid-template-columns:repeat(2,minmax(0,1fr))}
  .doc-parties{grid-template-columns:minmax(0,1fr)}
  .doc-title{text-align:left}
  .seal{grid-template-columns:minmax(0,1fr)}
}
@media (prefers-reduced-motion:no-preference){
  .step.now .dot{animation:pulse 2.4s ease-in-out infinite}
  @keyframes pulse{50%{box-shadow:0 0 0 6px var(--stamp-soft)}}
}
</style>

<div class="shell">
  <aside class="rail" aria-label="Books">
    <div class="brand"><b>Harvest Books</b><span>Bookkeeping and NRS e-invoicing</span></div>
    <nav class="navgroup" aria-label="Main">
      <button class="nav" data-go="overview">Monthly summary</button>
      <button class="nav" data-go="invoices">E-invoices <span class="badge" id="inv-badge" hidden></span></button>
    </nav>
    <nav class="navgroup" aria-label="Books">
      <h4>Books</h4>
      <button class="nav" data-go="cash">Cash book</button>
      <button class="nav" data-go="sales">Sales book</button>
      <button class="nav" data-go="purchases">Purchases book</button>
      <button class="nav" data-go="petty">Petty cash</button>
      <button class="nav" data-go="inventory">Inventory</button>
      <button class="nav" data-go="payroll">Payroll</button>
      <button class="nav" data-go="assets">Asset register</button>

  </aside>
  <main id="main" tabindex="-1"></main>
</div>
<div id="modal" hidden></div>
<div id="toast" hidden role="status"></div>

<script>
"use strict";
/* ---------- helpers ---------- */
const $=(s,r=document)=>r.querySelector(s), $$=(s,r=document)=>[...r.querySelectorAll(s)];
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const num=v=>{const n=parseFloat(String(v??"").replace(/[₦,\s]/g,""));return isFinite(n)?n:0};
const r2=n=>Math.round((n+Number.EPSILON)*100)/100;
const money=n=>{const v=num(n);return (v<0?"−":"")+"₦"+Math.abs(v).toLocaleString("en-NG",{minimumFractionDigits:2,maximumFractionDigits:2})};
const qty=n=>num(n).toLocaleString("en-NG",{maximumFractionDigits:3});
const compact=n=>{const a=Math.abs(n);return "₦"+(a>=1e6?(n/1e6).toFixed(a>=1e7?0:1)+"m":a>=1e3?Math.round(n/1e3)+"k":Math.round(n))};
const pad=n=>String(n).padStart(2,"0");
const iso=d=>d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate());
const todayISO=()=>iso(new Date());
const MONTHS=["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
const fmtDate=s=>{if(!s)return "";const [y,m,d]=String(s).slice(0,10).split("-");return `${+d} ${MONTHS[+m-1]||""} ${y}`};
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,8);
const sum=(a,f)=>a.reduce((t,x)=>t+num(f(x)),0);
const inRange=(d,a,b)=>d&&(!a||d>=a)&&(!b||d<=b);
let toastT;
function toast(msg){const t=$("#toast");t.textContent=msg;t.hidden=false;clearTimeout(toastT);toastT=setTimeout(()=>t.hidden=true,3200)}
function modal(html,onMount){const m=$("#modal");m.innerHTML=`<div class="box" role="dialog" aria-modal="true">${html}</div>`;m.hidden=false;m.onclick=e=>{if(e.target===m||e.target.closest("[data-close]"))closeModal()};onMount&&onMount(m);const f=m.querySelector("input,textarea,button");f&&f.focus()}
function closeModal(){const m=$("#modal");m.hidden=true;m.innerHTML=""}
document.addEventListener("keydown",e=>{if(e.key==="Escape"&&!$("#modal").hidden)closeModal()});
function armDelete(btn,fn){if(btn.classList.contains("armed")){fn();return}btn.classList.add("armed");const t=btn.textContent;btn.textContent="Confirm delete";setTimeout(()=>{if(btn.isConnected){btn.classList.remove("armed");btn.textContent=t}},4000)}

/* ---------- store ---------- */
const DEFAULTS={bizName:"",tin:"",businessId:"",serviceId:"",email:"",phone:"",street:"",city:"",postal:"",state:"",country:"NG",bizDesc:"",
  brand:"#1D5A3E",logo:"",cashOpening:0,pettyFloat:0,invPrefix:"INV",crnPrefix:"CRN",dbnPrefix:"DBN",
  codeInvoice:"380",codeCredit:"381",codeDebit:"384",vatRate:7.5,bank:"",terms:"Payment due within 30 days of invoice date."};
const COLS=["cash","sales","purchases","petty","inventory","payroll","assets","parties","invoices"];
const S={settings:{...DEFAULTS},mode:"loading",readOnly:false};COLS.forEach(c=>S[c]=[]);
let DB=null,DL=null;const LS="harvestbooks.v1";
function saveLocal(){try{localStorage.setItem(LS,JSON.stringify(Object.fromEntries([...COLS,"settings"].map(k=>[k,S[k]]))))}catch(e){}}
function loadLocal(){try{const j=JSON.parse(localStorage.getItem(LS)||"null");if(j){COLS.forEach(c=>S[c]=Array.isArray(j[c])?j[c]:[]);S.settings={...DEFAULTS,...(j.settings||{})}}}catch(e){}}
function dbErr(e){const c=e&&e.code;if(c==="invalid_argument"&&DB){S.readOnly=true;toast("You can view these books but your access does not allow changes.")}else if(c==="quota_exceeded")toast("Storage is full. Delete old example rows or export and archive a year of records.");else if(c==="revoked")toast("Access to these books changed. Reload to continue.");else toast("That change did not save. Check your connection and try again.");}
async function put(col,obj){
  if(S.readOnly){toast("You have view-only access.");throw new Error("ro")}
  const id=obj.id||uid();const body={...obj};delete body.id;const now=new Date().toISOString();body.updatedAt=now;if(!body.createdAt)body.createdAt=now;
  Object.keys(body).forEach(k=>{if(k.startsWith("_")||body[k]===undefined)delete body[k]});
  if(DB){try{await DB.collection(col).doc(id).set(body)}catch(e){dbErr(e);throw e}}
  else{const i=S[col].findIndex(r=>r.id===id);const row={id,...body};if(i>=0)S[col][i]=row;else S[col].push(row);saveLocal();refresh()}
  return id}
async function del(col,id){if(S.readOnly){toast("You have view-only access.");return}
  if(DB){try{await DB.collection(col).doc(id).delete()}catch(e){dbErr(e)}}else{S[col]=S[col].filter(r=>r.id!==id);saveLocal();refresh()}}
async function saveSettings(patch){const next={...S.settings,...patch};if(DB){try{await DB.doc("settings/main").set(next)}catch(e){dbErr(e);throw e}}else{S.settings=next;saveLocal();refresh()}}

/* ---------- books ---------- */
const PAY=["Cash","Bank transfer","POS","Credit"];
const BOOKS={
 cash:{title:"Cash book",blurb:"Every naira in or out of the business bank or cash account. The balance runs from your opening balance.",
  fields:[["date","Date","date",1],["desc","Description","text",1,2],["ref","Ref / voucher no","text"],["in","Money in (₦)","num"],["out","Money out (₦)","num"]],
  cols:[["date","Date","date"],["desc","Description"],["ref","Ref"],["in","Money in","money",1],["out","Money out","money",1],["_bal","Balance","money"]],
  opening:["cashOpening","Opening balance (₦)"],
  calc(rows,s){let b=num(s.cashOpening);return rows.map(r=>({...r,_bal:b+=num(r.in)-num(r.out)}))}},
 sales:{title:"Sales book",blurb:"Every sale, cash or credit. Amount is quantity × unit price, before VAT. Signed e-invoices post here automatically.",
  fields:[["date","Date","date",1],["customer","Customer","text",1],["product","Product","text",1],["qty","Quantity","num",1],["price","Unit price (₦)","num",1],["status","Payment","sel",0,0,PAY]],
  cols:[["date","Date","date"],["customer","Customer"],["product","Product"],["qty","Qty","qty"],["price","Unit price","money"],["_amt","Amount","money",1],["status","Payment"]],
  calc:rows=>rows.map(r=>({...r,_amt:r2(num(r.qty)*num(r.price))}))},
 purchases:{title:"Purchases book",blurb:"Every input or item bought: seed, feed, fertiliser, packaging, equipment. Record input VAT where the supplier charged it.",
  fields:[["date","Date","date",1],["supplier","Supplier","text",1],["item","Item","text",1],["qty","Quantity","num",1],["cost","Unit cost (₦)","num",1],["vat","Input VAT paid (₦)","num"],["status","Payment","sel",0,0,PAY]],
  cols:[["date","Date","date"],["supplier","Supplier"],["item","Item"],["qty","Qty","qty"],["cost","Unit cost","money"],["_amt","Amount","money",1],["vat","Input VAT","money",1],["status","Payment"]],
  calc:rows=>rows.map(r=>({...r,_amt:r2(num(r.qty)*num(r.cost))}))},
 petty:{title:"Petty cash",blurb:"Small day-to-day cash spending (transport, casual labour, minor repairs), kept apart from the cash book.",
  fields:[["date","Date","date",1],["desc","Description","text",1,2],["voucher","Voucher no","text"],["topup","Top-up (₦)","num"],["out","Amount out (₦)","num"]],
  cols:[["date","Date","date"],["desc","Description"],["voucher","Voucher"],["topup","Top-up","money",1],["out","Amount out","money",1],["_bal","Balance","money"]],
  opening:["pettyFloat","Petty cash float (₦)"],
  calc(rows,s){let b=num(s.pettyFloat);return rows.map(r=>({...r,_bal:b+=num(r.topup)-num(r.out)}))}},
 inventory:{title:"Inventory register",blurb:"Inputs, growing stock and harvested produce. The balance runs per item, so mixing items in one list stays accurate.",
  fields:[["date","Date","date",1],["item","Item","text",1],["type","Type","sel",0,0,["Input","Growing stock","Produce","Finished goods"]],["unit","Unit","text"],["qin","Qty in","num"],["qout","Qty out","num"],["notes","Notes","text",0,2]],
  cols:[["date","Date","date"],["item","Item"],["type","Type"],["unit","Unit"],["qin","Qty in","qty"],["qout","Qty out","qty"],["_bal","Balance for item","qty"],["notes","Notes"]],
  calc(rows){const b={};return rows.map(r=>{const k=String(r.item||"").trim().toLowerCase();b[k]=(b[k]||0)+num(r.qin)-num(r.qout);return {...r,_bal:b[k]}})}},
 payroll:{title:"Payroll",blurb:"Wages and salaries paid to staff and farm hands. Amount is days or hours worked × rate.",
  fields:[["date","Date / period","date",1],["name","Staff name","text",1],["role","Role","text"],["days","Days / hours worked","num",1],["rate","Rate (₦)","num",1],["method","Payment method","sel",0,0,["Cash","Bank transfer"]]],
  cols:[["date","Period","date"],["name","Staff"],["role","Role"],["days","Days/hours","qty"],["rate","Rate","money"],["_amt","Amount paid","money",1],["method","Method"]],
  calc:rows=>rows.map(r=>({...r,_amt:r2(num(r.days)*num(r.rate))}))},
 assets:{title:"Asset register",blurb:"Equipment, machinery, vehicles and land improvements, depreciated on a straight line to today.",
  fields:[["date","Date acquired","date",1],["asset","Asset","text",1],["desc","Description","text"],["cost","Cost (₦)","num",1],["life","Useful life (years)","num",1]],
  cols:[["date","Acquired","date"],["asset","Asset"],["desc","Description"],["cost","Cost","money",1],["life","Life (yrs)","qty"],["_dep","Annual depreciation","money",1],["_acc","Depreciated to date","money",1],["_nbv","Book value today","money",1]],
  calc(rows){const now=Date.now();return rows.map(r=>{const c=num(r.cost),l=num(r.life);const dep=l>0?c/l:0;const yrs=r.date?Math.max(0,(now-new Date(r.date).getTime())/31557600000):0;const acc=Math.min(c,dep*yrs);return {...r,_dep:r2(dep),_acc:r2(acc),_nbv:r2(c-acc)}})}},
 parties:{title:"Debtors and creditors",blurb:"Who owes the business and who the business owes. Overdue items are flagged against today's date.",
  fields:[["kind","Type","sel",1,0,["Debtor","Creditor"]],["name","Name","text",1],["desc","Description","text",0,2],["amount","Amount (₦)","num",1],["date","Date","date",1],["due","Due date","date"],["status","Status","sel",0,0,["Outstanding","Part-paid","Settled"]]],
  cols:[["kind","Type"],["name","Name"],["desc","Description"],["amount","Amount","money"],["date","Date","date"],["due","Due","date"],["status","Status"]],
  sortKey:"due",
  calc(rows){const t=todayISO();return rows.map(r=>({...r,_overdue:r.status!=="Settled"&&r.due&&r.due<t}))}}
};
function sorted(col,key){return [...S[col]].sort((a,b)=>String(a[key||"date"]||"").localeCompare(String(b[key||"date"]||""))||String(a.createdAt||"").localeCompare(String(b.createdAt||"")))}
function rowsFor(b){const B=BOOKS[b];return B.calc(sorted(b,B.sortKey),S.settings)}

/* ---------- NRS e-invoicing ---------- */
const TAXCATS={STANDARD_VAT:"Standard VAT",ZERO_VAT:"Zero-rated VAT",EXEMPTED:"VAT exempt"};
const UNITS=[["EA","Each"],["KGM","Kilogram"],["TNE","Tonne"],["LTR","Litre"],["BG","Bag"],["HUR","Hour"],["DAY","Day"]];
const MEANS=[["10","Cash"],["30","Credit transfer"],["42","Payment to bank account"],["48","Bank card"],["49","Direct debit"]];
const KINDS={invoice:"Invoice",credit:"Credit note",debit:"Debit note"};
const NRS_LABEL={draft:"Draft",validated:"Ready to sign",signed:"Signed by NRS",transmitted:"Transmitted",failed:"Rejected by NRS"};
const NRS_CHIP={draft:"",validated:"warn",signed:"stamp",transmitted:"ok",failed:"bad"};
const PAY_CHIP={PENDING:"warn",PARTIAL:"stamp",PAID:"ok"};
const PAY_LABEL={PENDING:"Unpaid",PARTIAL:"Part-paid",PAID:"Paid"};
const pct=l=>l.tax==="STANDARD_VAT"?num(S.settings.vatRate):0;
function calcInv(inv){
  const lines=(inv.lines||[]).map(l=>{const gross=r2(num(l.qty)*num(l.price));const disc=r2(num(l.discount));const ext=r2(gross-disc);const p=pct(l);return {...l,gross,disc,ext,pct:p,taxAmt:r2(ext*p/100)}});
  const subs={};lines.forEach(l=>{const k=l.tax||"STANDARD_VAT";subs[k]=subs[k]||{id:k,pct:l.pct,taxable:0,tax:0};subs[k].taxable=r2(subs[k].taxable+l.ext);subs[k].tax=r2(subs[k].tax+l.taxAmt)});
  const ext=r2(sum(lines,l=>l.ext)),tax=r2(sum(lines,l=>l.taxAmt));return {lines,ext,tax,incl:r2(ext+tax),subs:Object.values(subs)}}
const ymd=d=>String(d||"").replace(/-/g,"");
function irnFor(inv){return `${inv.number||""}-${S.settings.serviceId||""}-${ymd(inv.issueDate)}`}
const typeCode=k=>({invoice:S.settings.codeInvoice,credit:S.settings.codeCredit,debit:S.settings.codeDebit}[k||"invoice"]);
function payload(inv){
  const s=S.settings,t=calcInv(inv),c=inv.customer||{};const irn=inv.irn||irnFor(inv);
  const p={business_id:s.businessId,irn,issue_date:inv.issueDate,due_date:inv.dueDate||undefined,issue_time:inv.issueTime||"00:00:00",
    invoice_type_code:typeCode(inv.kind),invoice_kind:inv.invKind||"B2B",payment_status:inv.payStatus||"PENDING",note:inv.note||undefined,
    tax_point_date:inv.issueDate,document_currency_code:"NGN",tax_currency_code:"NGN"};
  if(inv.kind&&inv.kind!=="invoice")p.billing_reference=[{irn:inv.refIrn||"",issue_date:inv.refDate||""}];
  p.accounting_supplier_party={party_name:s.bizName,tin:s.tin,email:s.email,telephone:s.phone,business_description:s.bizDesc||undefined,
    postal_address:{street_name:s.street,city_name:s.city,postal_zone:s.postal||undefined,country:s.country}};
  if(c.tin||(inv.invKind||"B2B")!=="B2C")p.accounting_customer_party={party_name:c.name,tin:c.tin,email:c.email,telephone:c.phone,
    postal_address:{street_name:c.street||undefined,city_name:c.city,postal_zone:c.postal||undefined,country:c.country||"NG"}};
  p.payment_means=[{payment_means_code:inv.payMeans||"30",payment_due_date:inv.dueDate||inv.issueDate}];
  p.tax_total=[{tax_amount:t.tax,tax_subtotal:t.subs.map(x=>({taxable_amount:x.taxable,tax_amount:x.tax,tax_category:{id:x.id,percent:x.pct}}))}];
  p.legal_monetary_total={line_extension_amount:t.ext,tax_exclusive_amount:t.ext,tax_inclusive_amount:t.incl,payable_amount:t.incl};
  p.invoice_line=t.lines.map(l=>({hsn_code:l.hsn,product_category:l.category,discount_amount:l.disc||undefined,invoiced_quantity:num(l.qty),
    line_extension_amount:l.ext,item:{name:l.name,description:l.desc||l.name,sellers_item_identification:l.sku||l.hsn},
    price:{price_amount:num(l.price),base_quantity:1,price_unit:l.unit||"EA"}}));
  return p}
const RX={uuid:/^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/i,email:/^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/,phone:/^\+234\d{10}$/,svc:/^[A-Za-z0-9]{8}$/,alnum:/^[A-Za-z0-9]+$/,cc:/^[A-Z]{2}$/,time:/^\d{2}:\d{2}:\d{2}$/};
function validate(inv){
  const s=S.settings,e=[],w=[],c=inv.customer||{},kind=inv.invKind||"B2B";
  const E=(m,where="settings")=>e.push({m,where}),W=m=>w.push({m});
  if(!s.bizName)E("Add your registered business name.");
  if(!s.tin)E("Add your Tax Identification Number (TIN).");
  if(!RX.uuid.test(s.businessId||""))E("Business ID must be the 36-character ID from your NRS e-invoicing profile.");
  if(!RX.svc.test(s.serviceId||""))E("Service ID must be the 8-character code from your NRS profile. It forms part of every IRN.");
  if(!RX.email.test(s.email||""))E("Add a valid business email address.");
  if(!RX.phone.test(s.phone||""))E("Business phone must be in +234 format, for example +2348012345678.");
  if(!s.street||!s.city)E("Add your business street address and city.");
  if(!RX.cc.test(s.country||""))E("Country must be a two-letter code such as NG.");
  if(!RX.alnum.test(inv.number||""))E("Invoice number must use letters and numbers only, with no spaces or dashes.","doc");
  if(!inv.issueDate)E("Add the issue date.","doc");
  if(inv.issueTime&&!RX.time.test(inv.issueTime))E("Issue time must be in HH:MM:SS format.","doc");
  if(inv.dueDate&&inv.issueDate&&inv.dueDate<inv.issueDate)E("Due date cannot be before the issue date.","doc");
  if(!inv.dueDate)W("No due date set. NRS accepts this, but your debtor tracking needs one.");
  if(kind!=="B2C"){
    if(!c.name)E("Add the customer's name.","doc");
    if(String(c.tin||"").trim().length<5)E(`A ${kind} invoice needs the customer's TIN (at least 5 characters).`,"doc");
    if(!RX.email.test(c.email||""))E("Add the customer's email address.","doc");
    if(!c.phone)E("Add the customer's phone number.","doc");
    if(!c.city)E("Add the customer's city.","doc");
  }else if(!c.name)W("No customer name. Consumer (B2C) invoices can omit the buyer, but a name helps your records.");
  if(inv.kind&&inv.kind!=="invoice"&&!inv.refIrn)E(`A ${KINDS[inv.kind].toLowerCase()} must reference the IRN of the original invoice.`,"doc");
  const lines=inv.lines||[];
  if(!lines.length)E("Add at least one line item.","doc");
  lines.forEach((l,i)=>{const n=`Line ${i+1}`;
    if(!l.name)E(`${n}: add the item name.`,"doc");
    if(!l.hsn)E(`${n}: add the HS code for the item.`,"doc");
    if(!l.category)E(`${n}: add the product category.`,"doc");
    if(!(num(l.qty)>0))E(`${n}: quantity must be more than zero.`,"doc");
    if(!(num(l.price)>0))E(`${n}: unit price must be more than zero.`,"doc");
    if(num(l.discount)>num(l.qty)*num(l.price))E(`${n}: discount is larger than the line amount.`,"doc");});
  const irn=irnFor(inv);if(irn.length>50)E("The IRN would be longer than 50 characters. Shorten the invoice number.","doc");
  return {errors:e,warns:w,irn}}
function nextNumber(kind){const s=S.settings;const pre=(kind==="credit"?s.crnPrefix:kind==="debit"?s.dbnPrefix:s.invPrefix)||"INV";
  let max=0;S.invoices.forEach(i=>{if(String(i.number||"").startsWith(pre)){const n=parseInt(String(i.number).slice(pre.length),10);if(n>max)max=n}});return pre+String(max+1).padStart(4,"0")}
function qrSvg(data){try{if(typeof qrcode!=="function")return "";const q=qrcode(0,"M");q.addData(data);q.make();return q.createSvgTag({cellSize:3,margin:0,scalable:true})}catch(e){return ""}}

/* ---------- downloads ---------- */
async function offerFile(name,text,mime){
  if(DL){try{await DL.save({filename:name,data:new Blob([text],{type:mime})});toast(`Saved ${name}`);return}catch(e){if(e&&e.code==="declined")return}}
  if(!window.claude){try{const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([text],{type:mime}));a.download=name;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},500);toast(`Saved ${name}`);return}catch(e){}}
  modal(`<h2>${esc(name)}</h2><p class="muted small">Your browser view cannot save files here. Copy the text below into a file with this name.</p><textarea id="copytext" rows="14" style="font-family:var(--f-code);font-size:12.5px">${esc(text)}</textarea><div class="row end"><button data-close>Close</button><button class="primary" id="copybtn">Copy</button></div>`,m=>{
    $("#copybtn",m).onclick=()=>copyText(text,$("#copytext",m))})}
function copyText(text,fallbackEl){try{navigator.clipboard.writeText(text).then(()=>toast("Copied"),()=>{if(fallbackEl){fallbackEl.select();toast("Press Ctrl+C or ⌘C to copy")}})}catch(e){if(fallbackEl){fallbackEl.select();toast("Press Ctrl+C or ⌘C to copy")}}}
const csvCell=v=>{const s=String(v??"");return /[",\n]/.test(s)?'"'+s.replace(/"/g,'""')+'"':s};

/* ---------- views ---------- */
let VIEW="overview",SUB=null,raf=0;
const VIEWS={};
function go(v,sub){VIEW=VIEWS[v]?v:"overview";SUB=sub||null;try{history.replaceState(null,"","#"+VIEW)}catch(e){}mount();$("#main").focus({preventScroll:true});window.scrollTo(0,0)}
function mount(){$$(".nav").forEach(b=>{if(b.dataset.go===VIEW)b.setAttribute("aria-current","page");else b.removeAttribute("aria-current")});
  const m=$("#main");m.innerHTML="";VIEWS[VIEW].mount(m,SUB);VIEWS[VIEW].update&&VIEWS[VIEW].update(m)}
function refresh(){if(raf)return;raf=requestAnimationFrame(()=>{raf=0;const v=VIEWS[VIEW];v.update&&v.update($("#main"));badges()})}
function badges(){const n=S.invoices.filter(i=>["draft","validated","failed"].includes(i.nrs?.status||"draft")).length;const b=$("#inv-badge");b.hidden=!n;b.textContent=n;b.title=`${n} not yet signed by NRS`}
function modeNote(){const el=$("#mode");if(S.mode==="shared")el.innerHTML=`<strong>Saved to these books</strong>Everyone you share this page with sees the same records.`;
  else if(S.mode==="local")el.innerHTML=`<strong>Saved in this browser only</strong>Open the shared link to keep records for your team.`}

/* generic book view */
function bookView(key){const B=BOOKS[key];let editing=null;
  const fieldHtml=f=>{const [k,l,t,req,span,opts]=f;const id=`f-${key}-${k}`;const cls=span?"f span2":"f";
    if(t==="sel")return `<label class="${cls}" for="${id}">${l}<select id="${id}" name="${k}">${opts.map(o=>`<option>${esc(o)}</option>`).join("")}</select></label>`;
    return `<label class="${cls}" for="${id}">${l}<input id="${id}" name="${k}" ${t==="date"?'type="date"':t==="num"?'type="number" step="any" inputmode="decimal"':'type="text"'} ${req?"required":""}></label>`};
  return {
  mount(m){
    m.innerHTML=`<div class="wrap">
      <div class="head"><div class="titles"><h1>${B.title}</h1><p class="lede">${B.blurb}</p></div>
        <div class="row"><button id="exp">Export CSV</button></div></div>

  const renderLines=()=>{$("#lines",m).innerHTML=inv.lines.map(lineHtml).join("");recalc()};

    if(el.dataset.l){const i=+el.closest(".line").dataset.i;inv.lines[i][el.dataset.l]=el.value;if(el.dataset.l==="name"&&items[el.value]){const src=items[el.value];Object.assign(inv.lines[i],{hsn:src.hsn,category:src.category,unit:src.unit,price:src.price,tax:src.tax,desc:src.desc});renderLines();return}recalc()}});

  $("#addline",m).onclick=()=>{inv.lines.push(blankLine());renderLines();$$(".line",m).at(-1).querySelector("input").focus()};

  const clean=()=>{inv.lines=inv.lines.map(l=>({...l,qty:num(l.qty),price:num(l.price),discount:l.discount===""?"":num(l.discount)}));inv.nrs={...(inv.nrs||{}),status:"draft"};delete inv.irn};

    try{const id=await put("invoices",inv);toast("Validated. Ready to send for signing.");go("invoices",{id})}catch(e){}}},

 detail(m,id){

      const prev=num(inv.amountPaid);inv.payStatus=st;inv.amountPaid=r2(paid);await put("invoices",inv);if(inv.posted)await syncPayment(inv,prev);toast(`Payment status set to ${PAY_LABEL[st].toLowerCase()}`)}
  });

        done("signed")?`<p class="small muted">${inv.nrs.simulated?"Simulated":"Signed"} ${fmtDate((inv.nrs.signedAt||"").slice(0,10))}. CSID <span class="num">${esc(inv.nrs.csid||"")}</span></p>`:
        st==="validated"?`<p class="small muted">Send the payload below to your Access Point Provider. When NRS signs it, record the CSID and QR code data it returns.</p><div class="row"><button data-a="dl">Download payload</button><button class="stamp" data-a="record">Record NRS response</button></div><div class="row"><button class="ghost" data-a="sim">Simulate signing (test only)</button><button class="ghost danger" data-a="reject">Record a rejection</button></div>`:`<p class="small muted">Available after validation.</p>`)+

    $("#tabbody",mm).innerHTML=tab==="json"?`<div class="row" style="justify-content:space-between;margin-bottom:10px"><p class="small muted">The JSON your APP submits to NRS. Field names follow the NRS e-invoice specification.</p><div class="row"><button data-a="copy">Copy</button><button data-a="dl">Download JSON</button></div></div><pre class="code" id="json" tabindex="0">${esc(JSON.stringify(payload(inv),null,2))}</pre>`:fieldGuide()};

function docHtml(inv,t){const s=S.settings,c=inv.customer||{},st=inv.nrs?.status||"draft",signed=["signed","transmitted"].includes(st);
  const qr=signed&&inv.nrs.qr?qrSvg(inv.nrs.qr):"";
  return `<article class="doc" style="--brand:${esc(s.brand||"#1D5A3E")}" aria-label="Invoice preview"><div class="band"></div>
   <div class="doc-top"><div class="doc-from">${s.logo?`<img src="${esc(s.logo)}" alt="">`:""}<div><b>${esc(s.bizName||"Your business name")}</b><div class="dm">${esc([s.street,s.city,s.state].filter(Boolean).join(", "))}</div><div class="dm">TIN ${esc(s.tin||"not set")}</div><div class="dm">${esc(s.email)} ${esc(s.phone)}</div></div></div>
     <div class="doc-title"><div class="t">${KINDS[inv.kind||"invoice"]}</div><div class="n">${esc(inv.number)}</div></div></div>
   <div class="doc-parties"><div><h5>Bill to</h5><b>${esc(c.name||"")}</b><div class="dm">${esc([c.street,c.city].filter(Boolean).join(", "))}</div>${c.tin?`<div class="dm">TIN ${esc(c.tin)}</div>`:""}<div class="dm">${esc(c.email||"")}</div></div>
     <div><h5>Dates</h5><div>Issued ${fmtDate(inv.issueDate)}</div><div>Due ${fmtDate(inv.dueDate)}</div>${inv.refIrn?`<div class="dm">Ref IRN ${esc(inv.refIrn)}</div>`:""}</div>
     <div><h5>Payment</h5><div>${esc((MEANS.find(x=>x[0]===inv.payMeans)||[])[1]||"")}</div>${s.bank?`<div class="dm" style="white-space:pre-line">${esc(s.bank)}</div>`:""}</div></div>
   <div class="tbl"><table><thead><tr><th>Item</th><th>HS code</th><th class="r">Qty</th><th class="r">Unit price</th><th class="r">VAT</th><th class="r">Amount</th></tr></thead><tbody>
     ${t.lines.map(l=>`<tr><td>${esc(l.name)}${l.disc?`<div class="dm small">Less discount ${money(l.disc)}</div>`:""}</td><td>${esc(l.hsn)}</td><td class="r">${qty(l.qty)} ${esc(l.unit||"")}</td><td class="r">${money(l.price)}</td><td class="r">${l.pct}%</td><td class="r">${money(l.ext)}</td></tr>`).join("")}</tbody></table></div>
   <div class="doc-foot">
     <div class="seal ${signed?"":"pending"}">${signed&&inv.nrs.simulated?`<span class="sim">Simulated, not valid for tax</span>`:""}
       <div class="qr ${qr?"":"empty"}">${qr||(st==="validated"?"QR code appears once NRS signs":"Not yet submitted to NRS")}</div>
       <div style="display:flex;flex-direction:column;gap:4px;min-width:0"><span class="lbl">${signed?"NRS e-invoice":"Awaiting NRS signature"}</span><span class="irn">${esc(inv.irn||irnFor(inv))}</span>
        <span class="meta">${signed?`CSID ${esc(inv.nrs.csid||"")}<br>Signed ${fmtDate((inv.nrs.signedAt||"").slice(0,10))}`:"Invoice Reference Number, confirmed when NRS signs"}</span></div></div>
     <dl class="kv doc-sum"><dt>Subtotal</dt><dd>${money(t.ext)}</dd>${t.subs.map(x=>`<dt>${TAXCATS[x.id]} ${x.pct}%</dt><dd>${money(x.tax)}</dd>`).join("")}<dt class="grand">Total</dt><dd class="grand">${money(t.incl)}</dd></dl></div>
   ${inv.note||s.terms?`<p class="dm small">${esc(inv.note||"")} ${esc(s.terms||"")}</p>`:""}</article>`}

function fieldGuide(){const rows=[["business_id","Business ID from setup"],["irn","Invoice number, Service ID and issue date (YYYYMMDD), joined by dashes"],["invoice_type_code",`From setup: invoice ${S.settings.codeInvoice}, credit note ${S.settings.codeCredit}, debit note ${S.settings.codeDebit}`],["invoice_kind","Transaction type: B2B, B2G or B2C"],["accounting_supplier_party","Your business name, TIN, email, phone and address"],["accounting_customer_party","Customer block; required for B2B and B2G, optional for B2C without a TIN"],["billing_reference","Original invoice IRN and date, for credit and debit notes"],["invoice_line[].hsn_code","HS code on each line"],["invoice_line[].product_category","Category on each line"],["tax_total","VAT grouped by category: STANDARD_VAT, ZERO_VAT, EXEMPTED"],["legal_monetary_total","Subtotal, tax-exclusive, tax-inclusive and payable amounts"],["payment_status","PENDING, PARTIAL or PAID from the payment panel"]];
  return `<div class="tbl"><table><thead><tr><th>NRS field</th><th>Where it comes from</th></tr></thead><tbody>${rows.map(r=>`<tr><td class="num"><b>${r[0]}</b></td><td>${r[1]}</td></tr>`).join("")}</tbody></table></div>`}

function recordModal(inv,reject){
  modal(reject?`<h2>Record an NRS rejection</h2><p class="muted small">Paste the error message your APP returned. The invoice goes back to draft so you can correct it.</p><label class="f" for="rej">Error message<textarea id="rej" rows="4"></textarea></label><div class="row end"><button data-close>Cancel</button><button class="primary" id="ok">Save rejection</button></div>`
   :`<h2>Record NRS response for ${esc(inv.irn)}</h2><p class="muted small">Copy these values from your APP's signing response.</p>
    <label class="f" for="csid">Cryptographic stamp ID (CSID)<input id="csid" autocomplete="off"></label>
    <label class="f" for="qrd">QR code data<textarea id="qrd" rows="4" placeholder="Base64 string from the signing response"></textarea></label>
    <label class="f" for="sat">Signed on<input id="sat" type="date" value="${todayISO()}"></label>
    <div class="row end"><button data-close>Cancel</button><button class="stamp" id="ok">Save signed invoice</button></div>`,m=>{
    $("#ok",m).onclick=async()=>{if(reject){inv.nrs={...inv.nrs,status:"failed",error:$("#rej",m).value.trim()||"Rejected by NRS"}}
      else{const csid=$("#csid",m).value.trim(),qr=$("#qrd",m).value.trim();if(!csid||!qr){toast("Add both the CSID and the QR code data.");return}
        inv.nrs={...inv.nrs,status:"signed",simulated:false,csid,qr,signedAt:new Date($("#sat",m).value||todayISO()).toISOString()}}
      try{await put("invoices",inv);closeModal();toast(reject?"Rejection recorded":"Signed invoice recorded")}catch(e){}}})}

async function postToBooks(inv){if(inv.posted){toast("Already posted");return}
  const t=calcInv(inv),sign=inv.kind==="credit"?-1:1,posted={sales:[]};const cust=inv.customer?.name||"Customer";
  try{
    for(const l of t.lines){const id=await put("sales",{date:inv.issueDate,customer:cust,product:l.name,qty:sign*num(l.qty),price:num(l.qty)?r2(l.ext/num(l.qty)):0,status:inv.payStatus==="PAID"?"Bank transfer":"Credit",invoiceNo:inv.number,invoiceId:inv.id});posted.sales.push(id)}
    if(inv.kind!=="credit"){const bal=r2(t.incl-num(inv.amountPaid));
      if(bal>0)posted.party=await put("parties",{kind:"Debtor",name:cust,desc:`${KINDS[inv.kind]} ${inv.number}`,amount:bal,date:inv.issueDate,due:inv.dueDate||"",status:num(inv.amountPaid)>0?"Part-paid":"Outstanding",invoiceNo:inv.number,invoiceId:inv.id});
      if(num(inv.amountPaid)>0)posted.cash=[await put("cash",{date:todayISO(),desc:`Payment from ${cust}`,ref:inv.number,in:num(inv.amountPaid),out:"",invoiceNo:inv.number,invoiceId:inv.id})]}
    inv.posted=posted;await put("invoices",inv);toast("Posted to your books")}catch(e){}}
async function syncPayment(inv,prev){const t=calcInv(inv),paid=num(inv.amountPaid),delta=r2(paid-prev),cust=inv.customer?.name||"Customer";
  if(delta>0){const id=await put("cash",{date:todayISO(),desc:`Payment from ${cust}`,ref:inv.number,in:delta,out:"",invoiceNo:inv.number,invoiceId:inv.id});inv.posted.cash=[...(inv.posted.cash||[]),id]}
  const bal=r2(t.incl-paid);const party=inv.posted.party&&S.parties.find(p=>p.id===inv.posted.party);
  if(party)await put("parties",{...party,amount:bal>0?bal:party.amount,status:bal<=0?"Settled":paid>0?"Part-paid":"Outstanding"});
  else if(bal>0)inv.posted.party=await put("parties",{kind:"Debtor",name:cust,desc:`${KINDS[inv.kind||"invoice"]} ${inv.number}`,amount:bal,date:inv.issueDate,due:inv.dueDate||"",status:paid>0?"Part-paid":"Outstanding",invoiceNo:inv.number,invoiceId:inv.id});
  await put("invoices",inv)}

     ${F("invPrefix","Invoice number prefix","","Letters only, e.g. INV")}${F("crnPrefix","Credit note prefix")}${F("dbnPrefix","Debit note prefix")}
     ${F("codeInvoice","Invoice type code")}${F("codeCredit","Credit note type code")}${F("codeDebit","Debit note type code")}</div>
     <p class="note warn" style="margin-top:14px">Type codes differ between published NRS guides. Confirm them against the invoice-types list your APP or the NRS resources endpoint returns, and change them here if needed. API keys and secrets never go in this page; they stay with your APP.</p></div>
   <div class="panel"><div class="panel-h"><h2>Invoice look</h2></div><div class="grid g3">
     <div class="f">Logo<div class="row"><div class="logo-prev" id="logoprev"></div><input type="file" id="logo" accept="image/png,image/jpeg,image/svg+xml" style="width:auto"><button type="button" class="ghost" id="logorm">Remove</button></div><span class="hint">PNG, JPG or SVG under 120 KB</span></div>
     <label class="f" for="s-brand">Brand colour<span class="row"><input id="s-brand" name="brand" type="color" class="swatch"><span class="hint">Used for the top band and your name</span></span></label>
     <label class="f span2" for="s-bank">Bank details for payment<textarea id="s-bank" name="bank" rows="2" placeholder="Bank, account name, account number"></textarea></label>
     <label class="f span2" for="s-terms">Standard terms<textarea id="s-terms" name="terms" rows="2"></textarea></label></div></div>
   <div class="panel"><div class="panel-h"><h2>Backup and examples</h2></div><p class="small muted" style="margin-bottom:12px">Download a backup of every book regularly. Restoring adds the backup's records, replacing any with the same ID.</p>
     <div class="row"><button type="button" id="bk">Download backup</button><label class="btn" for="rs" tabindex="0">Restore from backup</label><input type="file" id="rs" accept="application/json,.json" hidden><button type="button" id="exl">Load example rows</button></div></div>
   <div class="row end"><button type="submit" class="primary">Save setup</button></div></form>`;
  const f=$("#sf",m);f.dataset.dirty="";f.oninput=()=>f.dataset.dirty="1";let logo=S.settings.logo||"";
  const showLogo=()=>{$("#logoprev",m).innerHTML=logo?`<img src="${esc(logo)}" alt="Logo preview">`:`<span class="hint">None</span>`};
  this.fill=()=>{Object.keys(DEFAULTS).forEach(k=>{if(f.elements[k])f.elements[k].value=S.settings[k]??""});logo=S.settings.logo||"";showLogo()};this.fill();
  $("#logo",m).onchange=e=>{const file=e.target.files[0];if(!file)return;if(file.size>120*1024){toast("That logo is over 120 KB. Use a smaller PNG or SVG.");e.target.value="";return}const rd=new FileReader();rd.onload=()=>{logo=rd.result;f.dataset.dirty="1";showLogo()};rd.readAsDataURL(file)};
  $("#bk",m).onclick=()=>offerFile(`harvest-books-backup-${todayISO()}.json`,JSON.stringify(Object.fromEntries([...COLS,"settings"].map(k=>[k,S[k]])),null,1),"application/json");
  const restore=async j=>{let n=0;for(const c of COLS)for(const r of (Array.isArray(j[c])?j[c]:[])){if(r&&typeof r==="object"){await put(c,{...r,id:String(r.id||uid())});n++}}if(j.settings&&typeof j.settings==="object"){const {logo,...rest}=j.settings;await saveSettings({...rest,...(logo?{logo}:{})});this.fill()}toast(`Restored ${n} records`)};
  $("#rs",m).onchange=e=>{const file=e.target.files[0];if(!file)return;const rd=new FileReader();rd.onload=async()=>{try{await restore(JSON.parse(rd.result))}catch(err){toast("That file is not a Harvest Books backup.")}e.target.value=""};rd.readAsText(file)};
  $("#exl",m).onclick=async()=>{try{const r=await fetch("data/sample-books.json");if(!r.ok)throw 0;await restore(await r.json())}catch(err){toast("The example file is not available here. Use Restore with data/sample-books.json from the repo.")}};
  $("#logorm",m).onclick=()=>{logo="";f.dataset.dirty="1";showLogo()};
  f.onsubmit=async e=>{e.preventDefault();const p={logo};Object.keys(DEFAULTS).forEach(k=>{if(f.elements[k]&&f.elements[k].type!=="file"){let v=f.elements[k].value.trim();if(["vatRate"].includes(k))v=num(v);if(["country"].includes(k))v=v.toUpperCase();if(["invPrefix","crnPrefix","dbnPrefix"].includes(k))v=v.replace(/[^A-Za-z]/g,"").toUpperCase();p[k]=v}});
    if(p.serviceId&&!RX.svc.test(p.serviceId))toast("Saved. Note: the Service ID should be exactly 8 letters or numbers.");
    try{await saveSettings(p);f.dataset.dirty="";if(!(p.serviceId&&!RX.svc.test(p.serviceId)))toast("Setup saved")}catch(err){}}},
 update(m){const f=$("#sf",m);if(f&&!f.dataset.dirty&&this.fill)this.fill()}};

/* ---------- boot ---------- */
$$(".nav").forEach(b=>b.onclick=()=>go(b.dataset.go));
window.go=go;
(async function boot(){
  const h=(location.hash||"").slice(1);VIEW=VIEWS[h]?h:"overview";mount();
  let api=null;try{if(window.claude&&typeof window.claude.use==="function")api=await window.claude.use("db")}catch(e){api=null}
  if(api){DB=api;S.mode="shared";
    COLS.forEach(c=>{try{DB.collection(c).onSnapshot(s=>{S[c]=s.docs.map(d=>({id:d.id,...d.data()}));refresh()},dbErr)}catch(e){}});
    try{DB.doc("settings/main").onSnapshot(s=>{S.settings={...DEFAULTS,...(s.exists?s.data():{})};refresh()},dbErr)}catch(e){}
    try{const u=await window.claude.use("user");if(u&&typeof u.can==="function"){const w=await u.can("data.write");if(w===false)S.readOnly=true}}catch(e){}
  }else{S.mode="local";loadLocal()}
  modeNote();refresh();
  try{if(window.claude&&window.claude.use)DL=await window.claude.use("downloads")}catch(e){DL=null}
})();
</script>
